# Generates PixelEarth.xcodeproj: run `xcodegen generate` after adding or removing source files.
name: PixelEarth
options:
  developmentLanguage: ko
  bundleIdPrefix: com.leeo
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
targets:
  PixelEarth:
    type: application
    platform: macOS
    sources:
      - path: Sources/PixelEarth
        excludes:
          - Resources
      - path: Sources/PixelEarth/Resources
        type: folder
        buildPhase: resources
      - path: App/Assets.xcassets
    info:
      path: Sources/PixelEarth-Info.plist
      properties:
        CFBundleName: 나엘
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        CFBundleDisplayName: 나엘
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.pixelearth
        PRODUCT_NAME: PixelEarth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # World generation and lighting are hot loops, so Debug stays optimized too.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
